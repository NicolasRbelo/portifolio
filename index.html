<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nicolas Rabelo de Melo — Desenvolvedor Full Stack (Python, React, React Native), pós-graduando em Cibersegurança. Portfólio interativo em terminal de vault."
    />
    <title>Nicolas Rabelo de Melo — Desenvolvedor Full Stack</title>
  </head>
  <body>
    <main id="stage" aria-label="Terminal interativo do portfólio">
      <canvas id="scene-canvas" aria-hidden="true"></canvas>

      <div id="boot" role="region" aria-label="Sequência de conexão">
        <div class="boot-log" id="boot-log" aria-live="polite"></div>
        <p class="boot-skip-hint">clique para pular</p>
      </div>

      <div id="hotspot-layer" aria-hidden="true"></div>

      <div id="scene-chrome">
        <div class="corner tl">NICOLAS.DEV // TERMINAL ATIVO</div>
        <div class="corner tr">SÃO PAULO-SP</div>
        <div class="corner bl">
          <a class="cv-link" id="cv-corner-link" download>↓ CURRÍCULO.PDF</a>
        </div>
      </div>

      <div id="panel-root">
        <div class="panel-backdrop" data-close></div>
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-head">
            <div>
              <p class="panel-kicker" id="panel-kicker">DOSSIÊ</p>
              <h2 id="panel-title">—</h2>
            </div>
            <button class="panel-close" type="button" data-close>FECHAR [X]</button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
